# Corpus de contenido para tools/generar-datos.py
#
# El CALENDARIO decide lo estructurado (habilidad, fonema, base fija) — eso no va acá.
# Este archivo aporta solo lo que exige redacción: ítems, vocabulario, coloquial y cuerpo.
#
# Fuente de los estímulos: Everyday Conversations, US Dept. of State, dominio público.
# Ver tools/corpus/FUENTES.md. Las preguntas, explicaciones y el cuerpo son originales.

1:
  objetivo: "Detectar dónde cae el acento en inglés y por qué moverlo rompe la palabra."
  stimulus: "Sorry, I'm a bit knackered — can we push this to tomorrow?"
  items:
    - tipo: listening
      instruccion: "Escuchá (o leé) la frase dos veces antes de responder."
      opciones:
        - "Que lo ayudes a terminar el trabajo hoy."
        - "Reprogramar la reunión para mañana."
        - "Que le pases un café."
        - "Que le expliques la tarea otra vez."
      correcta: B
      por_que: >-
        La petición está en «push this to tomorrow». «Knackered» es solo el motivo
        (está cansado), no lo que pide. Pide con cortesía en vez de mandar: en inglés
        británico eso es lo normal en el trabajo, y sonar directo de más se lee como
        grosero.
    - tipo: listening
      instruccion: "¿En qué sílaba cae el acento? Marcá una."
      stimulus: "tomorrow"
      opciones:
        - "to-MOR-row (segunda)"
        - "TO-mor-row (primera)"
        - "to-mor-ROW (tercera)"
        - "Todas igual, como en español."
      correcta: A
      por_que: >-
        Es la segunda. En español la regla de acentuación la podés deducir de la
        terminación; en inglés el acento es parte de la palabra y no se deduce de nada.
        «Tomorrow» se acentúa en el medio y nadie lo escribió con tilde para avisarte.
    - tipo: speaking
      instruccion: "Decí las tres en voz alta, marcando la sílaba larga. Una sola línea."
      stimulus: "record (verbo) · record (sustantivo) · present (verbo)"
      opciones: []
      correcta: null
      por_que: >-
        re-CORD «grabar» contra PRE-sent «documento», y pre-SENT «presentar» contra
        PRE-sent «regalo». Mover el acento en inglés no hace la palabra más extranjera:
        la convierte en otra palabra. Ese es todo el argumento del día.
  coloquial:
    - {expr: "push it to…", uk: "push it to", us: "reschedule", sentido: "Mover algo de fecha"}
    - {expr: "I'm beat", uk: "knackered", us: "beat", sentido: "Cansadísimo (la versión americana)"}
  vocabulario:
    - {palabra: "knackered", fuente: material, uk: knackered, us: beat,
       frase: "Sorry, I'm a bit knackered — can we push this to tomorrow?",
       sentido: "Cansadísimo, agotado"}
    - {palabra: "push it to…", fuente: material, uk: "push it to", us: reschedule,
       frase: "Can we push this to tomorrow?", sentido: "Mover algo de fecha"}
    - {palabra: "sorry", fuente: material, uk: sorry, us: "excuse me",
       frase: "Sorry, do you mind if I sit here?",
       sentido: "Disculpa — suaviza casi cualquier cosa"}
    - {palabra: "record (v)", fuente: frecuencia, uk: "re-CORD", us: "re-CORD",
       frase: "I'll record the meeting so you can listen later.",
       sentido: "Grabar. El acento va en la segunda."}
    - {palabra: "present (v)", fuente: frecuencia, uk: "pre-SENT", us: "pre-SENT",
       frase: "I'm presenting the results on Friday.",
       sentido: "Presentar. Mismo spelling que el sustantivo, acento distinto."}
    - {palabra: "about", fuente: frecuencia, uk: "a-BOUT", us: "a-BOUT",
       frase: "It'll take about five minutes.",
       sentido: "Aproximadamente. Acento en la segunda."}
  cuerpo: |
    En español la acentuación se deduce: si la palabra termina en vocal, n o s, el acento va en la
    penúltima sílaba salvo tilde. Tenés una regla y la aplicás.

    En inglés no hay regla. **El acento es parte de la palabra**, igual que el número de sílabas o las
    letras que la componen. No se deduce de la ortografía ni del final. Por eso «tomorrow» no lleva
    tilde y aun así se acentúa en el medio.

    Eso tiene una consecuencia que te va a servir las 13 semanas: **un acento mal puesto no te hace
    sonar exótico, te hace sonar otra palabra.** *re-CORD* es grabar; *PRE-sent* es un documento. No hay
    segunda lectura posible.

    Es el error raíz del hispanohablante, y va primero por eso — no por ser el más difícil, sino porque
    todo lo demás se apoya acá. La sílaba acentuada es la que se **estira**, y todas las demás se
    aplastan. Sin esa jerarquía no hay schwa que valga, ni function words que se reduzcan, ni ritmo que
    se escuche.

2:
  objetivo: "Escribir tres oraciones donde el acento caiga donde corresponde, y detectar el error en un texto ajeno."
  items:
    - tipo: writing
      instruccion: "Mirá este texto escrito por un hispanohablante y encontrá dónde está el acento mal puesto."
      stimulus: "I PREsent the RESults toMOrrow in the ofFICE."
      opciones:
        - "No hay ningún error: se entiende igual."
        - "«present» como verbo va pre-SENT, no PRE-sent."
        - "«tomorrow» se acentúa al final: to-mor-ROW."
        - "«office» lleva tilde en inglés: of-FÍCE."
      correcta: B
      por_que: >-
        «Present» como verbo se acentúa en la segunda sílaba — PREsent es el sustantivo, el documento.
        El resto está bien: «tomorrow» va en el medio y «office» es monosilábica... no: es dos, of-FICE,
        y en inglés no se marca con tilde nunca.
    - tipo: writing
      instruccion: "Reescribí la oración corrigiendo solo lo que haga falta. Una línea."
      stimulus: "We discuss the budget on FRIday."
      opciones: []
      correcta: null
      por_que: >-
        «Discuss» es monosilábica: no lleva acento, se dice sin cortes. Y «FRIday» sí se acentúa en
        la primera. Si decís "di-SKUSS" estás aplicando la regla española de que las esdrújulas se
        acentúan siempre.
    - tipo: writing
      instruccion: "Escribí tres oraciones de trabajo con verbos que cambian de sentido al mover el acento."
      opciones: []
      correcta: null
      por_que: >-
        Los pares son REcord/re-CORD, PREsent/pre-SENT, INcrease/in-CREASE, PERmit/per-MIT. Con cualquiera
        de ellos alcanza: la clave es que escribas la oración y después la digas en voz alta marcando la
        sílaba.
  writing:
    tarea: task_2
    consigna: "Some people say that working from home improves productivity. Others disagree. Discuss both views and give your own opinion."
    min_palabras: 250
  coloquial:
    - {expr: "run it by me", uk: "run it past me", us: "run it by me",
       sentido: "Mostrármelo antes de mandarlo"}
    - {expr: "touch base", uk: "touch base", us: "touch base",
       sentido: "Coordinar rápido, normalmente por llamada"}
  vocabulario:
    - {palabra: "deadline", fuente: frecuencia, uk: "DED-line", us: "DED-line",
       frase: "The deadline is Friday, so we need to move fast.",
       sentido: "Fecha límite. Acento en la primera."}
    - {palabra: "agenda", fuente: frecuencia, uk: "a-GEN-da", us: "a-GEN-da",
       frase: "Let's keep to the agenda, we're short on time.",
       sentido: "Orden del día. Acento en la segunda, no en la primera."}
    - {palabra: "update", fuente: frecuencia, uk: "UP-date", us: "UP-date",
       frase: "I'll send you an update tomorrow morning.",
       sentido: "Como sustantivo se acentúa arriba; como verbo, up-DATE."}
    - {palabra: "prefer", fuente: frecuencia, uk: "pre-FER", us: "pre-FER",
       frase: "I'd prefer to start earlier if that's okay.",
       sentido: "Preferir. Acento en la segunda."}
    - {palabra: "record (n)", fuente: material, uk: "RE-cord", us: "RE-cord",
       frase: "He broke the record for the fastest turnaround.",
       sentido: "Récord, el documento o la marca."}
    - {palabra: "present (n)", fuente: material, uk: "PRE-sent", us: "PRE-sent",
       frase: "She unwrapped the present under the tree.",
       sentido: "Regalo. Acento en la primera."}
  cuerpo: |
    El acento en inglés no es un detalle de pronunciación: **a veces cambia la palabra**. *PRE-sent* es un
    documento o un regalo; *pre-SENT* es presentar. El spelling es idéntico.

    Para escribir, eso se traduce en algo concreto: **no podés confiar en cómo se ve la palabra**. Un
    hispanohablante lee *present* y piensa "esdrújula, tilde implícita en la primera" — y en inglés eso
    solo vale cuando es el sustantivo.

    El truco de hoy es que **antes de escribir la digas**. Si la pronunciación sale mal, el error de
    escritura casi nunca aparece: el que escribe "we discuss" y lo dice "di-SKUSS" nunca se entera,
    porque en el papel las dos cosas se ven igual.

3:
  objetivo: "Producir en voz alta las tres formas sin que el acento del español se cuele."
  items:
    - tipo: speaking
      instruccion: "Decí la frase tres veces, cada vez más rápido. Grabate la tercera."
      stimulus: "Could you record the presentation tomorrow?"
      opciones: []
      correcta: null
      por_que: >-
        Hay tres acentos en la oración: pre-SEN-ta-TION... no: pre-sen-TA-tion, re-CORD y to-MOR-row.
        Ninguno es el primero de la palabra excepto «record». Si decís «pre-SENT-ation» cambiaste el
        sentido del verbo.
    - tipo: speaking
      instruccion: "Escuchá cómo suena y elegí qué escuchaste."
      stimulus: "an INcrease / an inCREASE"
      opciones:
        - "«Un aumento» — el sustantivo, acento al principio."
        - "«Aumentar» — el verbo, acento al final."
        - "Son exactamente lo mismo, el acento no cambia nada."
        - "Depende del país: en Reino Unido no cambia."
      correcta: A
      por_que: >-
        El primero, INcrease, es el sustantivo: «an increase in sales». inCREASE es el verbo. Es el
        mismo truco de record/present, y es la razón por la que este bloque va primero — si no dominás
        esto, ningún minimal pair te va a servir después.
    - tipo: speaking
      instruccion: "Formulá una pregunta de trabajo usando un par que cambie de sentido. Una línea."
      opciones: []
      correcta: null
      por_que: >-
        Algo como «Did you record the meeting?» contra «What's on the record?». Lo que importa no es el
        vocabulario: es que la oración obligue a acentuar distinto según lo que quieras decir.
  coloquial:
    - {expr: "my bad", uk: "my fault", us: "my bad",
       sentido: "Culpa mía — informal, se usa hablando"}
    - {expr: "sounds good", uk: "sounds good", us: "sounds good",
       sentido: "Me parece bien, la forma normal de cerrar"}
  vocabulario:
    - {palabra: "increase", fuente: frecuencia, uk: "INcrease / inCREASE", us: "INcrease / inCREASE",
       frase: "We saw a big increase last quarter.",
       sentido: "Sustantivo arriba, verbo abajo. Mismo spelling."}
    - {palabra: "permit", fuente: frecuencia, uk: "PERmit / per-MIT", us: "PERmit / per-MIT",
       frase: "They don't permit phones in the lab.",
       sentido: "El permiso es PERmit; permitir es per-MIT."}
    - {palabra: "contract", fuente: frecuencia, uk: "CON-tract / con-TRACT", us: "CON-tract / con-TRACT",
       frase: "We signed the contract last week.",
       sentido: "El contrato es CONtract; contraer es con-TRACT."}
    - {palabra: "object", fuente: frecuencia, uk: "OB-ject / ob-JECT", us: "OB-ject / ob-JECT",
       frase: "I didn't object to the plan.",
       sentido: "El objeto es OBject; objetar es ob-JECT."}
    - {palabra: "record (v)", fuente: material, uk: "re-CORD", us: "re-CORD",
       frase: "Can you record this call for me?",
       sentido: "Grabar. Acento en la segunda."}
    - {palabra: "presentation", fuente: material, uk: "pre-sen-TA-tion", us: "pre-sen-TA-tion",
       frase: "I've got a presentation at three.",
       sentido: "Acento en la tercera sílaba. No en la primera."}
  cuerpo: |
    Esta es la etapa donde se produce, no donde se escucha. **Decirlo en voz alta es el trabajo de hoy**,
    y es el que más resistencia va a tener: tu boca ya sabe acentuar en español y va a insistir.

    La regla que te sirve: **en inglés las palabras casi nunca se acentúan en la primera sílaba salvo que
    sean monosilábicas**. *Record*, *present*, *increase* como monosilábicos van arriba; los de dos o tres
    sílabas se van moviendo.

    Si te trabás es buena señal — significa que estás notando algo que antes dabas por obvio. **No lo
    aplanes**: la fluidez que viene después se construye sobre esta fricción, no reemplazándola.

4:
  objetivo: "Leer un texto corto y detectar dónde el acento cambiaría el sentido."
  items:
    - tipo: reading
      instruccion: "Leé el texto y respondé."
      stimulus: "We present the present results. The record shows we recorded a record increase."
      opciones:
        - "La oración es un juego de palabras y está bien formada."
        - "Está mal: no se pueden usar dos veces en la misma oración."
        - "Falta una coma entre «present» y «present»."
        - "El segundo «record» está mal escrito."
      correcta: A
      por_que: >-
        Es correcta y es exactamente el punto del día. «Present the present results» usa el verbo y el
        sustantivo en la misma oración, y «recorded a record increase» hace lo mismo. En inglés se lee
        bien porque el acento las separa; en español no podrías, porque las dos se pronunciarían igual.
    - tipo: reading
      instruccion: "¿Cuántas palabras del texto cambian de significado según dónde caiga el acento?"
      stimulus: "We present the present results. The record shows we recorded a record increase."
      opciones:
        - "Dos: present y record."
        - "Una sola: record."
        - "Ninguna — el acento no cambia significado en inglés."
        - "Cuatro: las cuatro apariciones."
      correcta: A
      por_que: >-
        Dos pares distintos, cuatro apariciones. «Present» y «record» son los sustantivos/verbos que
        cambian. Es más frecuente de lo que parece: los cinco pares del día 3 (increase, permit,
        contract, object) funcionan igual.
    - tipo: reading
      instruccion: "Subrayá en tu copia las sílabas acentuadas. Decí el texto en voz alta una vez."
      stimulus: "We present the present results. The record shows we recorded a record increase."
      opciones: []
      correcta: null
      por_que: >-
        pre-SENT the PRE-sent re-SULTS. re-CORD shows we re-CORded a RE-cord in-CREASE. Si al leer en
        voz alta te sale distinto de cómo lo escribirías, ahí está el error que este bloque busca.
  coloquial:
    - {expr: "go over", uk: "go over", us: "go over",
       sentido: "Repasar o revisar algo con alguien"}
    - {expr: "as per", uk: "as per", us: "as per",
       sentido: "Según — más formal, se usa en mails"}
  vocabulario:
    - {palabra: "turnover", fuente: frecuencia, uk: "TURN-o-ver", us: "TURN-o-ver",
       frase: "Staff turnover has been high this year.",
       sentido: "Rotación de personal. También: facturación. Acento en la primera."}
    - {palabra: "outstanding", fuente: frecuencia, uk: "out-STAND-ing", us: "out-STAND-ing",
       frase: "There are three outstanding invoices.",
       sentido: "Pendiente de pago — y también: excelente. Acento en la segunda."}
    - {palabra: "refund", fuente: frecuencia, uk: "RE-fund", us: "RE-fund",
       frase: "They gave me a full refund.",
       sentido: "El reembolso es REfund; devolver dinero es re-FUND."}
    - {palabra: "download", fuente: frecuencia, uk: "DOWN-load", us: "DOWN-load",
       frase: "Can you download the file?",
       sentido: "Sustantivo y verbo se acentúan igual acá — es una de las excepciones."}
    - {palabra: "increase (n)", fuente: material, uk: "INcrease", us: "INcrease",
       frase: "We recorded a record increase.",
       sentido: "Aumento, el sustantivo."}
    - {palabra: "present (n)", fuente: material, uk: "PRE-sent", us: "PRE-sent",
       frase: "We present the present results.",
       sentido: "Los resultados presentes — el adjetivo/sustantivo."}
  cuerpo: |
    Leer en voz alta es la prueba de fuego del acento léxico. **El texto se ve igual escrito bien o mal**,
    así que el papel no te avisa. Solo la voz.

    Fijate en cómo «We present the present results» funciona en inglés y no funcionaría en español: las
    dos *present* se escriben igual y se pronuncian distinto. Si el acento se cae, la oración se vuelve
    ambigua de la peor manera — se sigue entendiendo, pero suena a error.

    **Es la última etapa de este bloque.** Mañana empieza schwa: la sílaba no acentuada se apaga. Y eso
    solo tiene sentido si hoy quedó claro qué sílaba **no** se apaga.

5:
  objetivo: "Escuchar una conversación real y captar la hora y el ritmo, no las sueltas."
  stimulus: "NATASHA: What time is it? We're going to be late! / TONY: It's a quarter after seven. We're on time."
  items:
    - tipo: listening
      instruccion: "Leé la conversación ( Everyday Conversations, 1-5). ¿Qué hora dice Tony?"
      stimulus: "It's a quarter after seven. We're on time."
      opciones:
        - "6:45"
        - "7:15"
        - "7:45"
        - "6:15"
      correcta: B
      por_que: >-
        «A quarter after seven» es 7:15. En inglés británico se dice «quarter past» —
        mismo contenido, otra palabra. Esa es la variante UK que vas a escuchar en el
        botón de audio, y no se puede adivinar: hay que oírla.
    - tipo: listening
      instruccion: "¿Qué expresión usa el diálogo para decir que aún hay tiempo?"
      stimulus: "We're on time. / Rush hour is almost over."
      opciones:
        - "«Don't worry» — solo tranquiliza. No da información. / «Rush hour» es la hora pico."
        - "«Don't worry» da información de tiempo. / «Rush hour» es la hora pico."
        - "Ninguna de las dos dice nada sobre el tiempo."
        - "Solo «Rush hour»: «Don't worry» es una muletilla vacía."
      correcta: A
      por_que: >-
        «Don't worry» no aporta información de tiempo, solo baja la ansiedad de
        Natasha. «Rush hour» sí: es la hora punta, y Tony la usa como argumento —
        si pasó la hora pico, van a llegar. Es razonar con el contexto, no con el
        vocabulario suelto.
    - tipo: speaking
      instruccion: "Formulá la pregunta de Tony con el acento correcto. Una sola línea."
      stimulus: "What / time / is / it?"
      opciones: []
      correcta: null
      por_que: >-
        Es monosilábica cada palabra, así que el acento cae en «TIME» e «IT», no al
        principio de la frase como saldría por inercia española. Decila despacio y
        después empujala: «what's the TIME?»
  coloquial:
    - {expr: "a quarter after / past", uk: "quarter past", us: "quarter after",
       sentido: "Y cuarto — la hora cambia de palabra según el país"}
    - {expr: "we're on time", uk: "on time", us: "on time",
       sentido: "Llegamos a la hora (no «a tiempo de», que es «in time for»)"}
  vocabulario:
    - {palabra: "quarter", fuente: material, uk: "QUAR-ter", us: "QUAR-ter",
       frase: "It's a quarter after seven.",
       sentido: "Un cuarto. En inglés la segunda sílaba se aplasta: no se dice «quar-TÉr»."}
    - {palabra: "rush hour", fuente: material, uk: "RUSH hour", us: "RUSH hour",
       frase: "Rush hour is almost over.",
       sentido: "La hora pico. Acento en la primera palabra."}
    - {palabra: "late", fuente: frecuencia, uk: "late", us: "late",
       frase: "We're going to be late!",
       sentido: "Tarde. Es una de las palabras más frecuentes del inglés."}
    - {palabra: "surprise", fuente: frecuencia, uk: "sur-PRISE", us: "sur-PRISE",
       frase: "The party is a surprise, so don't tell anyone.",
       sentido: "Sorpresa. Acento en la segunda."}
    - {palabra: "restaurant", fuente: frecuencia, uk: "RES-trawnt", us: "RES-taw-rant",
       frase: "We have to be at the restaurant by 7:30.",
       sentido: "Restaurante. En británico se aplasta hasta dos sílabas."}
    - {palabra: "almost", fuente: frecuencia, uk: "AL-most", us: "AL-most",
       frase: "Rush hour is almost over.",
       sentido: "Casi. Acento en la primera."}
  cuerpo: |
    Esta es la etapa de producción del bloque: **no se escucha para entender, se escucha para
    imitar**. La diferencia importa — entender una frase y poder decirla son dos habilidades
    separadas, y la segunda es la que rinde en el speaking real.

    Fijate en algo del diálogo que probablemente pasaste por alto: **«quarter after» en
    estadounidense es «quarter past» en británico.** No es acento, es vocabulario distinto
    para la misma idea. Si solo escuchaste una variante, la otra te suena a error.

    Por eso el audio de cada día viene en dos botones. **Los dos dicen lo mismo con voz
    distinta** — y cuando el vocabulario también cambia, lo dice el día entero.

    El error típico acá es escuchar, entender y seguir leyendo. **No.** Repetí la frase en voz
    alta inmediatamente, sin mirar el texto. Si no sale, volvé a leerla una vez y probá de
    nuevo. Ese ida y vuelta es todo el trabajo.

6:
  objetivo: "Cerrar el bloque de acento léxico escribiendo con jerarquía silábica, no con tildes."
  items:
    - tipo: writing
      instruccion: "Escribí cómo dirías estas tres oraciones. Mirá dónde cae el acento."
      stimulus: "I PRESENT the present. / He RECORDED the record. / An INCREASE in increase."
      opciones: []
      correcta: null
      por_que: >-
        Present the PRE-sent. re-CORded the RE-cord. An INcrease in in-CREASE. Son los tres
        pares del bloque entero comprimidos en una línea. Si los escribís y los decís y
        salen iguales, no los entendiste: son dos palabras cada uno.
    - tipo: writing
      instruccion: "Corregí este párrafo: hay dos acentos mal puestos. Escribí la versión arreglada."
      stimulus: "I have a MEETing at TEN. We'll DIScuss the BUDget."
      opciones:
        - "I have a MEETing at TEN. We'll DIScuss the BUDget."
        - "I have a me-ETING at ten. We'll dis-CUSS the budget."
        - "I have a meEting at TEN. We'll diSsccus the budGET."
        - "Está bien como está: en español se acentúa todo igual."
      correcta: B
      por_que: >-
        «Meeting» va me-ETING (tres sílabas, acento en la segunda) y «discuss» es
        monosilábica pero su acento natural es el único que tiene — el error es leerla
        como «DIS-cuss» por parecerse a «discount». «Budget» va BUD-get, en la primera.
    - tipo: writing
      instruccion: "Escribí 3 oraciones de trabajo donde una palabra cambie de sentido con el acento."
      opciones: []
      correcta: null
      por_que: >-
        Los pares que sirven para esto: contract, object, permit, increase, record,
        present. Con tres alcanza, pero escribilas y decilas. Es la última vez que este
        bloque se practica: mañana empieza schwa.
  writing:
    tarea: task_2
    consigna: "Some people believe that learning English is mainly about vocabulary. Others say pronunciation matters more. Discuss both views and give your own opinion."
    min_palabras: 250
  coloquial:
    - {expr: "call it a day", uk: "call it a day", us: "call it a day",
       sentido: "Parar por hoy — se cierra el bloque con esto"}
    - {expr: "wrap up", uk: "wrap up", us: "wrap up",
       sentido: "Terminar o cerrar algo"}
  vocabulario:
    - {palabra: "contract", fuente: frecuencia, uk: "CON-tract / con-TRACT", us: "CON-tract / con-TRACT",
       frase: "We need to sign the contract.",
       sentido: "El contrato y contraer. Mismo spelling, acento distinto."}
    - {palabra: "object", fuente: frecuencia, uk: "OB-ject / ob-JECT", us: "OB-ject / ob-JECT",
       frase: "Nobody objected to the plan.",
       sentido: "El objeto y objetar."}
    - {palabra: "permit", fuente: frecuencia, uk: "PERmit / per-MIT", us: "PERmit / per-MIT",
       frase: "They don't permit cameras here.",
       sentido: "El permiso y permitir."}
    - {palabra: "increase", fuente: material, uk: "INcrease / inCREASE", us: "INcrease / inCREASE",
       frase: "There was an increase in sales.",
       sentido: "El aumento y aumentar."}
    - {palabra: "discuss", fuente: frecuencia, uk: "dis-CUSS", us: "dis-CUSS",
       frase: "We'll discuss the budget tomorrow.",
       sentido: "Discutir. Monosilábica: no hay DIS-cuss."}
    - {palabra: "meeting", fuente: frecuencia, uk: "MEET-ing", us: "MEET-ing",
       frase: "I have a meeting at ten.",
       sentido: "Reunión. Acento en la primera, y la segunda se aplasta."}
  cuerpo: |
    **Cierre del bloque.** Si las 90 semanas se sostienen sobre una base, esto es la base.

    La regla que se lleva de acá: **en español la acentuación se deduce de la terminación;
    en inglés es parte de la palabra**. No hay tilde que te avise, ni una regla que te salve
    el día que no la recordás.

    Y eso tiene una consecuencia práctica que te va a servir escribiendo: **un hispanohablante
    escribe y dice la misma palabra igual**, porque en el papel las dos se ven idénticas. El
    que escribe «we'll discuss» y lo lee «di-SKUSS» nunca se entera — es el error invisible.

    La defensa es simple y no cuesta nada: **decí en voz alta lo que escribís**. Si la
    pronunciación sale mal, el error de escritura casi nunca llega a la hoja.

7:
  objetivo: "Detectar la sílaba que se apaga en inglés — el sonido que el español nunca reduce."
  stimulus: "about · support · computer · the banana"
  items:
    - tipo: speaking
      instruccion: "Decí estas tres palabras y escuchá qué sílaba se APAGA. Marcá una opción."
      stimulus: "about · support · computer"
      opciones:
        - "La segunda en «about», la segunda en «support», la tercera en «computer»."
        - "Todas se acentúan igual, en la primera sílaba."
        - "La primera en las tres."
        - "Ninguna se apaga: las tres se dicen completo."
      correcta: A
      por_que: >-
        Es la segunda en «about» (a-BOUT) y en «support» (sup-PORT), y la tercera en
        «computer» (com-PU-ter). Pero lo que importa no es dónde va el acento — eso ya
        lo viste la semana pasada. Es que **la otra sílaba se apaga**: en «about» la
        primera no es «a», es apenas un soplo.
    - tipo: speaking
      instruccion: "Decí la oración completa. ¿Qué palabra se aplasta? Una opción."
      stimulus: "Can you tell me about the computer?"
      opciones:
        - "«can», «you», «the» y «-er» de «computer»: se dicen casi sin abrir la boca."
        - "Solo «can»: el resto se dice completo."
        - "Ninguna: se pronuncian todas igual que en español."
        - "Solo el artículo «the»."
      correcta: A
      por_que: >-
        Las function words —«can», «you», «the»— y las sílabas no acentuadas se aplastan
        hasta casi desaparecer. «Can» no se dice /ken/, se dice casi /kn/. «You» se dice
        casi /j/. Si decís cada palabra abriendo bien la boca, la oración suena robótica
        aunque todas las palabras estén bien.
    - tipo: speaking
      instruccion: "Grabate diciendo la frase dos veces: una plana, otra con las reducciones. ¿Cuál suena más nativa?"
      stimulus: "Can you tell me about the computer?"
      opciones: []
      correcta: null
      por_que: >-
        La segunda. Es el truco del ritmo inglés: **el acento manda, el resto se achica**.
        En español achicar una vocal la vuelve otra letra — «casa» contra «cosa» son
        palabras distintas. En inglés la vocal reducida es SIEMPRE la misma, el /ə/, y
        por eso no cambia nada: nadie confunde «about» con otra palabra.
  coloquial:
    - {expr: "'bout", uk: "'bout", us: "'bout",
       sentido: "La forma hablada de «about». Se oye en música y en charla."}
    - {expr: "kinda / wanna / gonna", uk: "sort of / want to / going to", us: "kinda / wanna / gonna",
       sentido: "Se aplasta lo que no se acentúa. Es la misma regla del día."}
  vocabulario:
    - {palabra: "about", fuente: frecuencia, uk: "a-BOUT", us: "a-BOUT",
       frase: "Can you tell me about the computer?",
       sentido: "Sobre. La primera sílaba es apenas un soplo: /əˈbaʊt/."}
    - {palabra: "support", fuente: frecuencia, uk: "sup-PORT", us: "sup-PORT",
       frase: "Do you have any support for that?",
       sentido: "Apoyo. Acento en la segunda; la primera se aplasta."}
    - {palabra: "computer", fuente: frecuencia, uk: "com-PU-ter", us: "com-PU-ter",
       frase: "The computer is very old.",
       sentido: "Computadora. Acento en la segunda; las otras dos se achican."}
    - {palabra: "tell", fuente: frecuencia, uk: "tell", us: "tell",
       frase: "Can you tell me about it?",
       sentido: "Decir o contar. Monosilábica: se dice entera."}
    - {palabra: "the", fuente: frecuencia, uk: "ðə", us: "ðə",
       frase: "The computer is on the table.",
       sentido: "El/la. Nunca se dice «de» ni «da» completa: es casi muda."}
    - {palabra: "can", fuente: frecuencia, uk: "kn", us: "kn",
       frase: "Can you help me?",
       sentido: "Poder. En frase dicha se reduce hasta /kn/, casi sin vocal."}
  cuerpo: |
    Empieza el bloque más importante de los trece. **Schwa: la sílaba que se apaga.**

    En español cada vocal tiene su sonido y se dice entera. *Casa* y *cosa* son palabras
    distintas porque la vocal cambió. **Reducir una vocal en español la vuelve otra letra.**

    En inglés pasa lo contrario. **La vocal no acentuada no es otra vocal: es un soplo**, el
    sonido más frecuente de todo el idioma, escrito *ə*. En «about» la primera sílaba no es
    «a» — apenas respirás. En «computer» la última no es «u» ni «e», es un susurro.

    De ahí la consecuencia que ordena todo lo que viene: **en inglés la sílaba acentuada manda
    y todas las demás se achican**. No se pronuncian las palabras; se pronuncia la frase, con
    montañas y valles. Decir cada palabra abriendo bien la boca —«can / you / tell / me»—
    suena robótico con todas las palabras correctas.

    **Es el error número uno del hispanohablante y el que más rápido corrige.** Y es la razón
    por la que el bloque de acento léxico fue primero: sin saber cuál sílaba manda, no hay
    ninguna que se pueda apagar.

8:
  objetivo: "Leer en inglés sin pronunciar cada sílaba, y notar cuáles se caen."
  stimulus: "The computer in the office was about to be replaced, but the manager couldn't remember the budget."
  items:
    - tipo: reading
      instruccion: "Leé la oración. ¿Cuántas sílabas se dicen completas, sin aplastar?"
      stimulus: "The computer in the office was about to be replaced."
      opciones:
        - "«computer», «office», «replaced» — las acentuadas. El resto se achica."
        - "Todas: se pronuncian enteras como en español."
        - "Solo «computer»."
        - "Ninguna: en inglés no se aplasta nada."
      correcta: A
      por_que: >-
        Tres palabras con acento fuerte y todo lo demás —«the», «in», «was», «to be»—
        se reduce a casi nada. Esa es la jerarquía: la frase no es una hilera de
        palabras igualitas, es una montaña con tres picos.
    - tipo: reading
      instruccion: "¿Qué palabra tiene la sílaba más apagada de toda la oración?"
      stimulus: "The computer in the office was about to be replaced."
      opciones:
        - "La primera de «about»: /ə-BOUT/, apenas un soplo."
        - "La última de «computer»."
        - "El artículo «the»."
        - "Todas se apagan por igual."
      correcta: A
      por_que: >-
        La primera de «about» es la más reducida de la oración entera: es el schwa
        puro, /ə/, que no es una vocal sino la ausencia de vocal. El artículo «the»
        también se aplasta, pero conserva su consonante /ð/ — «about» arranca sin
        casi nada.
    - tipo: reading
      instruccion: "Subrayá las sílabas acentuadas y leé en voz alta marcando los picos."
      opciones: []
      correcta: null
      por_que: >-
        com-PU-ter · OF-fice · a-BOUT · re-PLACED. Si los tres picos no quedan claros
        al decirlo, la oración suena plana aunque cada palabra esté bien.
  coloquial:
    - {expr: "kind of / kinda", uk: "kind of", us: "kinda",
       sentido: "Más o menos. En habla se aplasta en una sola palabra."}
    - {expr: "want to / wanna", uk: "want to", us: "wanna",
       sentido: "Querer. La reducción es la regla del día hecha palabra."}
  vocabulario:
    - {palabra: "about", fuente: frecuencia, uk: "a-BOUT", us: "a-BOUT",
       frase: "The computer was about to be replaced.",
       sentido: "A punto de, o sobre. La primera sílaba es un soplo."}
    - {palabra: "computer", fuente: frecuencia, uk: "com-PU-ter", us: "com-PU-ter",
       frase: "The computer in the office is old.",
       sentido: "Computadora. Acento en la segunda; las otras dos se achican."}
    - {palabra: "office", fuente: frecuencia, uk: "OF-fice", us: "OF-fice",
       frase: "I'm in the office until five.",
       sentido: "Oficina. Acento en la primera."}
    - {palabra: "manager", fuente: frecuencia, uk: "MAN-a-ger", us: "MAN-i-ger",
       frase: "The manager couldn't remember.",
       sentido: "Gerente. Tres sílabas, acento en la primera."}
    - {palabra: "replace", fuente: frecuencia, uk: "re-PLACE", us: "re-PLACE",
       frase: "We need to replace the printer.",
       sentido: "Reemplazar. Acento en la segunda."}
    - {palabra: "budget", fuente: frecuencia, uk: "BUD-get", us: "BUD-get",
       frase: "The budget is too tight this year.",
       sentido: "Presupuesto. Acento en la primera; la segunda se aplasta."}
  cuerpo: |
    Día de percepción, pero en **lectura** — y eso cambia el trabajo. El papel no te avisa
    qué sílaba se cae: está escrita igual que las demás. Hay que decidirlo antes de abrir
    la boca.

    El truco de hoy es contar los picos, no las sílabas. **«The computer in the office was
    about to be replaced» tiene tres picos y doce sílabas.** Si intentás pronunciar las doce,
    la oración suena a máquina y el oyente pierde el hilo — no porque esté mal, sino porque
    en inglés eso no se procesa como habla.

    Lo que distingue a un lector fluido no es que entienda más palabras: es que **se salta
    las sílabas sin darse cuenta**. Es un hábito de lectura, no de vocabulario.

9:
  objetivo: "Escuchar a alguien pedir que le repitan, y captar qué se perdió y por qué."
  stimulus: "Dialogue 1-7 · Can You Say That Again? (Everyday Conversations, US Dept. of State)"
  items:
    - tipo: listening
      instruccion: "En la escena, la persona no entendió y pide repetición. ¿Cómo lo pide?"
      stimulus: "Sorry, could you say that again?"
      opciones:
        - "«Sorry» + petición en pasado. Cortés, sin mandar."
        - "«Hey!» + imperativo directo."
        - "«What?» a los gritos."
        - "No pide nada: finge que entendió."
      correcta: A
      por_que: >-
        «Could you say that again?» es la forma normal de pedir repetición: va en
        condicional, que en inglés suaviza la petición. Un «What?» solo se usa entre
        amigos o cuando algo te molestó. La diferencia no es vocabulario, es registro.
    - tipo: listening
      instruccion: "¿Qué palabra de la petición se APAGA al decirlo rápido?"
      stimulus: "Sorry, could you say that again?"
      opciones:
        - "«could»: se reduce hasta casi desaparecer."
        - "«again»: se corta al final."
        - "«sorry»: se dice «sry»."
        - "Ninguna: cada palabra se dice entera."
      correcta: A
      por_que: >-
        Es «could», una function word. En frase hablada se escucha casi /kjəd/, sin la
        vocal larga. «Again» también se aplasta en la segunda sílaba, pero la palabra
        entera se oye. Si decís «COULD you SAY that A-GAIN» con todas abiertas, suena
        a lectura en voz alta, no a charla.
    - tipo: listening
      instruccion: "Pensá en una situación de tu trabajo en la que perderías algo. Escribí la frase para pedir repetición."
      opciones: []
      correcta: null
      por_que: >-
        «Sorry, could you run that by me again?» — «run it by me» es la versión más
        coloquial y aparece en el día 2. Lo que importa no es la frase bonita: es que
        la digas en voz alta antes de anotarla.
  coloquial:
    - {expr: "say that again", uk: "say that again", us: "say that again",
       sentido: "Pedir repetición — lo más útil del día"}
    - {expr: "run it by me", uk: "run it past me", us: "run it by me",
       sentido: "Explícamelo otra vez, más informal"}
  vocabulario:
    - {palabra: "could", fuente: frecuencia, uk: "kjəd", us: "kjəd",
       frase: "Could you say that again?",
       sentido: "Podrías. Function word: se aplasta hasta casi oírse /kjəd/."}
    - {palabra: "again", fuente: frecuencia, uk: "ə-GEN", us: "ə-GEN",
       frase: "Sorry, could you say that again?",
       sentido: "Otra vez. Acento en la segunda; la primera es un soplo."}
    - {palabra: "sorry", fuente: material, uk: "SOR-ry", us: "SOR-ry",
       frase: "Sorry, do you mind?",
       sentido: "Disculpa. En Reino Unido se usa muchísimo más que en Estados Unidos."}
    - {palabra: "hear", fuente: frecuencia, uk: "here", us: "here",
       frase: "I didn't hear you, sorry.",
       sentido: "Oír. Se escribe distinto de «here» pero se dice igual."}
    - {palabra: "repeat", fuente: frecuencia, uk: "re-PEAT", us: "re-PEAT",
       frase: "Could you repeat the last part?",
       sentido: "Repetir. Acento en la segunda."}
    - {palabra: "mind", fuente: frecuencia, uk: "mind", us: "mind",
       frase: "Do you mind if I sit here?",
       sentido: "Importar, molestar. Monosilábica: se dice entera."}
  cuerpo: |
    **Pedir que te repitan es la habilidad más subestimada del plan.** La mayoría intenta
    entenderlo todo y calla cuando se pierde — y ahí se pierde la conversación entera.

    En inglés pedir repetición no es grosero: **es lo normal**. «Sorry, could you say that
    again?» no te hace sonar menos competente, te hace sonar profesional. Lo que suena mal
    es asentir sin haber entendido.

    Lo que importa hoy no es la frase: es que **se diga rápido y sin apuro**. «Could you»
    se aplasta, «again» aterriza en la segunda sílaba. Si la decís letra por letra suena a
    manual de instrucciones.

    Fijate en el registro: «What?» entre amigos funciona, en una reunión no. **Esa es toda
    la diferencia entre inglés de aula e inglés de trabajo.**

10:
  objetivo: "Escribir una frase donde lo que se aplasta sea lo que se aplasta al hablar."
  items:
    - tipo: writing
      instruccion: "Escribí esta oración y marcá mentalmente los picos antes de mirar la respuesta."
      stimulus: "I think the budget was about the same."
      opciones: []
      correcta: null
      por_que: >-
        THINK · BUDget · ABOUt · SAME. Cuatro picos, ocho sílabas. Las otras —«I», «the»,
        «was», «the»— son casi ruido. Si la escribís y la decís y todos los sonidos salen
        iguales, es que no la estás leyendo como inglés.
    - tipo: writing
      instruccion: "Corregí el ritmo de esta oración: está escrita bien pero dicha suena robótica."
      stimulus: "I want to go to the office because the manager is there."
      opciones:
        - "El ritmo sale de las palabras: WANT · OF-fice · MAN-a-ger. Lo demás se aplasta."
        - "Hay que agregarle tildes en español."
        - "Está bien dicha completa: es más claro así."
        - "No se puede saber leyendo, solo escuchando."
      correcta: A
      por_que: >-
        Tres picos: WANT, OF-fice y MAN-a-ger. «to», «the», «because», «is», «there» son
        function words y se achican. El texto no cambia — cambia cuánto se abre la boca
        en cada sílaba.
    - tipo: writing
      instruccion: "Escribí tres oraciones cortas de trabajo y contá sus picos. Una línea cada una."
      opciones: []
      correcta: null
      por_que: >-
        Regla práctica: una oración de trabajo tiene entre dos y cuatro picos. Si tiene
        seis, es demasiado larga y nadie la va a retener. Escribir en inglés es escribir
        con jerarquía.
  writing:
    tarea: task_2
    consigna: "Some people think that speaking clearly is more important than using advanced vocabulary. Others disagree. Discuss both views and give your own opinion."
    min_palabras: 250
  coloquial:
    - {expr: "more or less", uk: "more or less", us: "more or less",
       sentido: "Más o menos — cierra casi cualquier respuesta vaga"}
    - {expr: "the thing is", uk: "the thing is", us: "the thing is",
       sentido: "Lo que pasa es que — introduce el punto duro"}
  vocabulario:
    - {palabra: "think", fuente: frecuencia, uk: "think", us: "think",
       frase: "I think the budget was about the same.",
       sentido: "Pensar. Monosilábica: picos enteros, nada que aplastar."}
    - {palabra: "budget", fuente: material, uk: "BUD-get", us: "BUD-get",
       frase: "The budget was about the same.",
       sentido: "Presupuesto. Acento en la primera."}
    - {palabra: "because", fuente: frecuencia, uk: "BEE-cuz", us: "BEE-cuz",
       frase: "I'm late because the meeting ran over.",
       sentido: "Porque. Se contrae hasta /bɪkəz/ en habla rápida."}
    - {palabra: "same", fuente: frecuencia, uk: "same", us: "same",
       frase: "It's about the same.",
       sentido: "Igual. Monosilábica."}
    - {palabra: "about", fuente: material, uk: "a-BOUT", us: "a-BOUT",
       frase: "It's about the same.",
       sentido: "Más o menos. Soplo inicial + sílaba fuerte."}
    - {palabra: "wonder", fuente: frecuencia, uk: "WON-der", us: "WON-der",
       frase: "I wonder if that's right.",
       sentido: "Preguntarse. Acento en la primera."}
  cuerpo: |
    **Producción escrita del schwa.** Y la verdad incómoda: en papel no se ve. El inglés
    escrito es sordo respecto de su propio ritmo.

    Por eso el trabajo de hoy no es escribir mejor: es **escribir y luego decir**. La
    oración sale de la boca, y ahí aparece lo que el papel escondió — que la escribiste
    plana, con todas las palabras abiertas igual.

    Un truco que sirve: **contá los picos al escribir**. Si tu oración tiene cinco, cortala.
    El inglés de trabajo se construye con frases de dos a cuatro picos, y eso es una
    decisión de escritura, no de pronunciación.

    Es la etapa más resistida del bloque, porque obliga a leer en voz alta algo escrito —
    que se siente ridículo las primeras veces. **Las tres semanas siguientes se pagan acá.**

11:
  objetivo: "Decir una oración larga sin que se desmorone, dejando caer lo que corresponde."
  items:
    - tipo: speaking
      instruccion: "Decí la frase tres veces, más rápido cada vez. Grabate la última."
      stimulus: "I wanted to ask about the budget because the manager said it was about to change."
      opciones: []
      correcta: null
      por_que: >-
        Picos: WANted · ASK · BUDget · MANa-ger · ABOUt · CHANGE. Seis, que es el máximo
        de una oración. Si te trabás en algún punto, ese es el que hay que practicar —
        no la oración entera.
    - tipo: speaking
      instruccion: "Escuchá mentalmente la versión plana y la reducida. ¿Cuál suena más natural?"
      stimulus: "I wanted to ask about the budget."
      opciones:
        - "La reducida: «wanted» aplasta la segunda sílaba y «to» casi desaparece."
        - "La plana: cada palabra abierta es más claro."
        - "Son iguales en inglés."
        - "Depende del acento: en Reino Unido no se reduce."
      correcta: A
      por_que: >-
        Se reduce siempre, en ambos acentos — lo que cambia entre UK y US es el vocabulario
        y las vocales, no el principio de reducir. «Wanted» se dice /WAN-tɪd/, con la
        segunda sílaba casi muda, y «to» se funde con lo que viene.
    - tipo: speaking
      instruccion: "Formulá una pregunta de trabajo larga y contá sus picos en voz alta."
      opciones: []
      correcta: null
      por_que: >-
        «Do you know if the budget has changed?» — cuatro picos: DO · KNOW · BUDget ·
        CHANGED. Lo demás se aplasta. Si te salen seis, la oración es demasiado.
  coloquial:
    - {expr: "kind of a lot", uk: "kind of a lot", us: "kinda a lot",
       sentido: "Bastante — se funde todo en una cadena"}
    - {expr: "gonna", uk: "going to", us: "gonna",
       sentido: "La reducción de «going to», oída en todos lados"}
  vocabulario:
    - {palabra: "wanted", fuente: frecuencia, uk: "WAN-tid", us: "WAN-tid",
       frase: "I wanted to ask about the budget.",
       sentido: "Quería. La segunda sílaba casi no se oye."}
    - {palabra: "ask", fuente: frecuencia, uk: "ask", us: "ask",
       frase: "I wanted to ask a question.",
       sentido: "Preguntar. Monosilábica, acento entero."}
    - {palabra: "said", fuente: frecuencia, uk: "sed", us: "sed",
       frase: "The manager said it was about to change.",
       sentido: "Dijo. Se escribe «said» pero se dice /sed/."}
    - {palabra: "change", fuente: frecuencia, uk: "change", us: "change",
       frase: "The budget is about to change.",
       sentido: "Cambiar. Monosilábica."}
    - {palabra: "know", fuente: frecuencia, uk: "no", us: "no",
       frase: "Do you know if that's right?",
       sentido: "Saber. La «k» inicial no se pronuncia."}
    - {palabra: "going to", fuente: material, uk: "gonna", us: "gonna",
       frase: "I'm going to send it now.",
       sentido: "Voy a. En habla se funde en «gonna»."}
  cuerpo: |
    **Producción hablada del schwa.** El día donde la oración larga se sostiene sola.

    El truco es que **los picos se marcan con el volumen y el alargamiento, no con la
    pausa**. Si cortás entre palabras para dejar claras las importantes, la frase suena a
    dictado. En inglés lo que baja no se corta: se pasa por encima rápido.

    «I WANted to ASK about the BUDget» — «to» y «about» no desaparecen, se dicen apretados
    y seguidos. **Es un valle, no un hueco.**

    Si algo se te traba, no repitas la oración entera. **Aisla la palabra y trava esa.** Es
    el mismo método del drill fonético de la base diaria: trabajar la pieza, no la pieza
    completa.

12:
  objetivo: "Cerrar el bloque leyendo en voz alta sin que se note que estás leyendo."
  items:
    - tipo: reading
      instruccion: "Leé el texto completo en voz alta. Después, sin mirar, contá cuántos picos tuvo."
      stimulus: "The manager said the budget was about to change. She wanted to ask about it, but the meeting had already gone over. Nobody knew if the new numbers would be the same."
      opciones:
        - "Ocho picos: MAN-a-ger · BUDget · ABOUt · WAN-ted · ASK · MEET-ing · NUM-bers · SAME."
        - "Tres: solo las palabras más largas."
        - "Ninguno: la entonación no existe en inglés escrito."
        - "Uno por oración, siempre el primero."
      correcta: A
      por_que: >-
        Ocho picos repartidos en tres oraciones — entre dos y cuatro por oración, que es
        exactamente la regla del día 10. Si contaste uno por oración, estás acentuando
        siempre la primera palabra, que es el error español más común.
    - tipo: reading
      instruccion: "¿Qué tres palabras del texto tienen la sílaba más apagada?"
      stimulus: "The manager said the budget was about to change."
      opciones:
        - "«to» de «about», «a-» de «manager» y «-get» de «budget»."
        - "«the», «the», «was»."
        - "No hay ninguna apagada: se leen todas enteras."
        - "Solo la última sílaba de «manager»."
      correcta: A
      por_que: >-
        Los schwas puros: /ə-BOUT/, /MAN-ə-ger/ y /BUD-get/. Los artículos y «was» también
        se aplastan, pero conservan su consonante. El schwa es la ausencia de vocal, no
        una vocal más corta.
    - tipo: reading
      instruccion: "Grabate leyendo el texto. Comparalo con el audio UK y el US del día."
      opciones: []
      correcta: null
      por_que: >-
        Es el cierre del bloque. Si tu grabación se acerca a cualquiera de las dos, el
        schwa quedó. Si suena a lectura en voz alta, lo que falta no es vocabulario: es
        que todavía estás pronunciando cada sílaba.
  coloquial:
    - {expr: "went over", uk: "went over", us: "went over",
       sentido: "Se pasó del tiempo — de una reunión"}
    - {expr: "the thing is", uk: "the thing is", us: "the thing is",
       sentido: "Lo que pasa es que — repetido del día 10, ahora consolidado"}
  vocabulario:
    - {palabra: "already", fuente: frecuencia, uk: "awl-RED-y", us: "awl-RED-y",
       frase: "The meeting had already gone over.",
       sentido: "Ya. Tres sílabas con el primer sonido casi mudo."}
    - {palabra: "nobody", fuente: frecuencia, uk: "NO-bo-dee", us: "NO-bo-dee",
       frase: "Nobody knew if it would change.",
       sentido: "Nadie. Acento en la primera."}
    - {palabra: "numbers", fuente: frecuencia, uk: "NUM-bers", us: "NUM-bers",
       frase: "The new numbers look better.",
       sentido: "Cifras. Acento en la primera."}
    - {palabra: "meeting", fuente: material, uk: "MEET-ing", us: "MEET-ing",
       frase: "The meeting had already gone over.",
       sentido: "Reunión. La segunda sílaba se aplasta."}
    - {palabra: "new", fuente: frecuencia, uk: "noo", us: "noo",
       frase: "The new numbers are here.",
       sentido: "Nuevo. Monosilábica."}
    - {palabra: "overtime", fuente: frecuencia, uk: "O-ver-time", us: "O-ver-time",
       frase: "We're not getting paid for overtime.",
       sentido: "Horas extra. Acento en la primera."}
  cuerpo: |
    **Cierre del bloque.** Schwa es el sonido más frecuente del inglés — más que cualquier
    vocal — y es el que hace que una oración suene a habla y no a lista.

    Si algo te quedó de estas seis jornadas: **la sílaba acentuada manda, y todo lo demás
    se achica**. No es una licencia ni un atajo: es la estructura. Decir cada palabra
    abierta no es más claro, es menos procesable.

    Y una cosa que casi nadie dice: **esto no se nota cuando lo hacés bien**. Un hispanohablante
    que reduce bien no suena "con acento fuerte", suena a alguien que lleva rato hablando
    inglés. Es el cambio más grande por hora invertida del plan entero.

13:
  objetivo: "Reconocer las palabras que no significan nada pero sostienen la frase."
  stimulus: "the · a · of · to · in · and · but · or"
  items:
    - tipo: listening
      instruccion: "Estas ocho palabras se dicen casi sin abrir la boca. ¿Cuáles tienen schwa?"
      stimulus: "the · a · of · to · in · and"
      opciones:
        - "Todas menos «in»."
        - "Ninguna: son palabras completas."
        - "Solo «the»."
        - "Solo «and»."
      correcta: B
      por_que: >-
        Ninguna: **todas tienen schwa**. /ðə/ · /ə/ · /əv/ · /tə/ · /ɪn/ · /ənd/. Es la
        razón por la que este bloque viene después: las function words son schwa hecho
        palabra. Si el bloque anterior quedó claro, este se cae de su peso.
    - tipo: listening
      instruccion: "Escuchá la frase y contá cuántas function words se aplastan."
      stimulus: "I gave the report to the manager and the budget of the new project."
      opciones:
        - "Seis: «the», «to», «the», «and», «the», «of»."
        - "Ninguna: se pronuncian enteras."
        - "Dos: «the» y «to»."
        - "Cuatro, las del final."
      correcta: A
      por_que: >-
        Seis function words aplastadas contra cinco palabras de contenido. **Más de la
        mitad de la frase es casi ruido** — y es exactamente lo que hace que el inglés
        tenga ritmo. Si leés las seis enteras, la oración dura el doble.
    - tipo: listening
      instruccion: "Decí la frase completa dejando caer las function words. Una línea."
      opciones: []
      correcta: null
      por_que: >-
        «I GAVE the rePORT to the MANager and the BUDget of the NEW PROject.» Cuatro
        picos... cinco. Lo importante es que se oigan ellos y nada más: si también se
        oye «the», estás pronunciando artículo.
  coloquial:
    - {expr: "kind of / sort of", uk: "kind of / sort of", us: "kinda / sorta",
       sentido: "Function words fundidas: el patrón del bloque"}
    - {expr: "give it to me", uk: "give it to me", us: "gimme",
       sentido: "En habla real se funde en una sola palabra"}
  vocabulario:
    - {palabra: "the", fuente: frecuencia, uk: "ðə", us: "ðə",
       frase: "I gave the report to the manager.",
       sentido: "El/la. Se reduce a /ðə/ y casi nunca se oye entera."}
    - {palabra: "of", fuente: frecuencia, uk: "əv", us: "əv",
       frase: "The budget of the new project.",
       sentido: "De. Se escribe «of» y suena /əv/, sin vocal clara."}
    - {palabra: "to", fuente: frecuencia, uk: "tə", us: "tə",
       frase: "I gave the report to the manager.",
       sentido: "A. En frase dicha es apenas /tə/."}
    - {palabra: "and", fuente: frecuencia, uk: "ənd", us: "ənd",
       frase: "The budget and the numbers.",
       sentido: "Y. En habla rápida se funde: «bundget»."}
    - {palabra: "but", fuente: frecuencia, uk: "bət", us: "bət",
       frase: "I wanted to go, but the meeting ran over.",
       sentido: "Pero. La vocal es un soplo."}
    - {palabra: "report", fuente: frecuencia, uk: "re-PORT", us: "re-PORT",
       frase: "I gave the report to the manager.",
       sentido: "Informe. Es palabra de contenido: se oye completa."}
  cuerpo: |
    Empieza el bloque de las **function words** — las palabras que no significan nada y
    sostienen la frase entera: *the, a, of, to, in, and, but, or*.

    La primera mitad del plan las trató como vocabulario. **No lo son.** Se dicen apretadas
    y seguidas, y su valor no está en el sonido sino en la posición: marcan cuál es el sujeto
    y cuál el objeto, cuándo algo se completa y cuándo empieza.

    De ahí la consecuencia que ordena este bloque: **si las dices enteras, la oración se
    alarga el doble y pierde el ritmo**. No se entiende peor — se procesa como alguien que
    no habla inglés, sino que lo deletrea.

    Lo que las vuelve difíciles no es el sonido: ya los conocés del bloque anterior. Es que
    **hay que dejar de pronunciarlas**, que es lo contrario de todo lo que te enseñaron.

14:
  objetivo: "Escribir sin function words de más, y leer en voz alta dejando caer las que sí van."
  items:
    - tipo: writing
      instruccion: "¿Cuál de estas dos frases suena más natural al decirla?"
      stimulus: "A: I gave the report to the manager. / B: I gave report to manager."
      opciones:
        - "A: los artículos van, pero se dicen apretados, no se borran."
        - "B: los artículos sobran y se pueden omitir siempre."
        - "Ninguna: en inglés se omiten artículos como en español."
        - "B: es la forma hablada real."
      correcta: A
      por_que: >-
        Los artículos **van escritos** — solo se aplastan al hablar. Quitarlos es un error
        de escritura, no una licencia de informalidad. Es la distinción clave del bloque:
        se reduce el sonido, no la palabra.
    - tipo: writing
      instruccion: "Reescribí esta oración eliminando lo que sobre y marcando los picos."
      stimulus: "In my opinion, I think that the budget is, in fact, too big."
      opciones:
        - "I think the budget is too big. — cuatro picos: THINK · BUDget · IS · BIG."
        - "Está bien así: en inglés se permite la redundancia."
        - "I think that the budget is too big. — solo se quita «in my opinion»."
        - "No se puede recortar sin cambiar el sentido."
      correcta: A
      por_que: >-
        «In my opinion» + «I think» dicen lo mismo, e «in fact» no aporta. El inglés de
        trabajo premia la economía: cuatro picos se retienen; seis se pierden. Lo que
        sobra en escritura también sobra al hablar.
    - tipo: writing
      instruccion: "Escribí tres oraciones donde las function words solo se aprieten al decirlas."
      opciones: []
      correcta: null
      por_que: >-
        Todas van escritas. Ninguna se borra. Lo que cambia es cuánto se abre la boca:
        /ðə BUDget əv ðə NEW PROject/ contra «THE BUDGET OF THE NEW PROJECT». Escribí
        la primera y decí la segunda.
  writing:
    tarea: task_2
    consigna: "Some people believe that clear writing at work matters more than correct grammar. Others think grammar is essential. Discuss both views and give your own opinion."
    min_palabras: 250
  coloquial:
    - {expr: "the thing is", uk: "the thing is", us: "the thing is",
       sentido: "Lo que pasa es que — la frase que ordena un punto"}
    - {expr: "as a matter of fact", uk: "as a matter of fact", us: "actually",
       sentido: "En realidad. UK y US lo dicen distinto."}
  vocabulario:
    - {palabra: "opinion", fuente: frecuencia, uk: "ə-PIN-yən", us: "ə-PIN-yən",
       frase: "In my opinion, the budget is too big.",
       sentido: "Opinión. Acento en la segunda; primera y última se apagan."}
    - {palabra: "fact", fuente: frecuencia, uk: "fakt", us: "fakt",
       frase: "In fact, the budget is fine.",
       sentido: "Hecho. Monosilábica, acento entero."}
    - {palabra: "opinion", fuente: material, uk: "ə-PIN-yən", us: "ə-PIN-yən",
       frase: "What's your opinion on this?",
       sentido: "Repetido a propósito: es de las pocas palabras con dos schwas."}
    - {palabra: "grammar", fuente: frecuencia, uk: "GRAM-ar", us: "GRAM-er",
       frase: "His grammar is good but his rhythm is flat.",
       sentido: "Gramática. Acento en la primera; la segunda es schwa."}
    - {palabra: "essential", fuente: frecuencia, uk: "ə-SEN-shəl", us: "ə-SEN-shəl",
       frase: "Grammar is essential when you write.",
       sentido: "Esencial. Acento en la segunda."}
    - {palabra: "actually", fuente: frecuencia, uk: "AK-choo-lee", us: "AK-chul-ee",
       frase: "Actually, I think it's fine.",
       sentido: "En realidad. Acento en la primera."}
  cuerpo: |
    **Percepción escrita de las function words.** Y el error que arrastra todo el bloque:
    **confundir reducir con omitir**.

    Los artículos, las preposiciones y las conjunciones **van escritas**. «I gave report to
    manager» no es inglés informal, es inglés mal escrito. Lo que pasa al hablar es que se
    aplastan hasta casi desaparecer — pero la palabra está.

    Eso tiene una consecuencia directa en la escritura: **lo que se aplasta al hablar es
    candidato a sobrar en la escritura**. «In my opinion» + «I think» dicen lo mismo; si
    los dos están, uno sobra. El inglés de trabajo se limpia quitando redundancia, no
    acortando palabras de contenido.

    La regla del día: **escribí completo, decí apretado**. Los dos movimientos a la vez,
    y ninguno en lugar del otro.
